# Builds the client and publishes it to GitHub Pages on every push to main.
# There's no game server there: the menu's server field starts empty, so the
# page plays solo against bots unless a visitor enters a server to join.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Pages serves the site under /<repo>/, so asset paths need that prefix.
      # A static demo: the menu's server field starts empty, so the page plays solo.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          VITE_STATIC_DEMO: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
